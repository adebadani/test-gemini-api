name: AI PR Review

on:
  pull_request:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor != 'dependabot[bot]' && (
        (github.event_name == 'pull_request') ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '/review'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      issues: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Rules (CRITICAL)
            **IMPORTANT**: FIRST, read `.claude/CLAUDE.md` for this repository's TypeScript/Angular/accessibility standards before reviewing.

            Perform a comprehensive code review of the changes in this pull request, focused on:

            1. **Code Quality**
               - Clean code principles and best practices
               - Proper error handling and edge cases
               - Code readability and maintainability

            2. **Security**
               - Potential security vulnerabilities
               - Input sanitization
               - Authentication/authorization logic

            3. **Performance**
               - Potential performance bottlenecks
               - Efficiency of queries/algorithms
               - Memory leaks or resource issues

            4. **Testing**
               - Adequate test coverage
               - Test quality and edge cases
               - Missing test scenarios

            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations or praise.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
